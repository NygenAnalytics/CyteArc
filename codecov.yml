# The Tests workflow uploads one coverage report from each of the four
# Python 3.14 shards. Codecov merges them and reports only after all four.
codecov:
  notify:
    after_n_builds: 4
comment:
  after_n_builds: 4

ignore:
  - "tests/*"

github_checks: false

coverage:
  precision: 2
  round: down
  range: "85...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false
