name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "profiling/.env.example"
      - "profiling/AGENTS.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "profiling/.env.example"
      - "profiling/AGENTS.md"

jobs:
  quality:
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: uv sync --group dev --group profiling --group cytebase --extra test --extra extra --extra agent --extra cytebase
    - name: Lint and check formatting
      run: |
        uv run ruff check cytearc profiling tests
        uv run ruff format --check cytearc profiling tests
    - name: Type check
      run: uv run mypy cytearc profiling

  visual:
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
      MPLBACKEND: Agg
      CYTEARC_RUN_VISUAL_REGRESSION: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: uv sync --group profiling --extra test --extra extra --extra agent
    - name: Download test fixtures
      run: uv run python -m tests.download_fixtures --with-h5ad
    - name: Compare publication plotting references
      run: uv run pytest -n 0 -m visual tests/test_plotting_showcase.py

  wheel:
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libhdf5-dev libfftw3-dev libmetis-dev
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.14"
    - name: Build and smoke-test wheel
      run: |
        uv build
        uv run --no-project python tests/smoke_wheel.py dist/*.whl

  pyarrow:
    # pandas stores text with pyarrow whenever it is installed, as in many user
    # environments. The lock file does not install it, so these jobs layer it on
    # the locked environment and run the quick suite.
    name: pyarrow (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        # One job took about eight minutes, twice the slowest test shard; four
        # shards, balanced like the test jobs, keep it off the critical path.
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: uv sync --group profiling --group cytebase --extra test --extra extra --extra agent --extra cytebase
    - name: Download test fixtures
      run: uv run python -m tests.download_fixtures --with-h5ad
    - name: Test the quick suite with pyarrow installed
      run: |
        uv run --with pyarrow python -c "import pandas; assert pandas.Series(['a']).dtype.storage == 'pyarrow'"
        uv run --with pyarrow pytest -n logical --durations=25 -m "not slow and not integration" --shard "${{ matrix.shard }}/4"

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.resolution }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
      UV_CACHE_DIR: /tmp/uv-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        resolution: [locked, lowest-direct]
        # Each job runs a quarter of the test files, balanced by
        # tests/shard_durations.json. The pytest step names the shard count.
        shard: [1, 2, 3, 4]
        exclude:
          - python-version: "3.14"
            resolution: lowest-direct
          - python-version: "3.15"
            resolution: lowest-direct
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install system build dependencies
      # h5py and sgtsnepi publish no Python 3.15 wheels yet, so that row
      # compiles them against HDF5, FFTW, and METIS.
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libhdf5-dev libfftw3-dev libmetis-dev
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Restore the uv cache
      # setup-uv's cache misses whenever uv.lock changes, and the 3.15 row then
      # compiles every package without a 3.15 wheel again (about 20 minutes).
      # The fallback key restores the latest earlier cache instead. Wheels are
      # built against the runner image's libraries, so its release is in the key.
      uses: actions/cache@v6
      with:
        path: /tmp/uv-cache
        key: uv-ubuntu-26.04-${{ matrix.python-version }}-${{ matrix.resolution }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: uv-ubuntu-26.04-${{ matrix.python-version }}-${{ matrix.resolution }}-
    - name: Install dependencies (locked)
      if: matrix.resolution == 'locked'
      run: uv sync --group profiling --group cytebase --extra test --extra extra --extra agent --extra cytebase
    - name: Install dependencies (lowest-direct)
      if: matrix.resolution == 'lowest-direct'
      run: |
        uv venv --python "${{ matrix.python-version }}"
        uv pip install --resolution lowest-direct -e ".[test,extra,agent,cytebase]" --group profiling --group cytebase
    - name: Download test fixtures
      run: |
        if [ "${{ matrix.resolution }}" = "lowest-direct" ]; then
          uv run --no-sync python -m tests.download_fixtures --with-h5ad
        else
          uv run python -m tests.download_fixtures --with-h5ad
        fi
    - name: Report runner CPU capacity
      run: |
        echo "available_cpu_count=$(nproc)"
        echo "installed_cpu_count=$(nproc --all)"
    - name: Test with pytest (parallel)
      run: |
        pytest_args=(-n logical --durations=25 --shard "${{ matrix.shard }}/4")
        if [ "${{ matrix.resolution }}" = "locked" ] && [ "${{ matrix.python-version }}" = "3.14" ]; then
          # Codecov merges the four shard reports; codecov.yml waits for all of them.
          pytest_args+=(--cov=cytearc --cov-report=xml)
        fi
        uv run --no-sync pytest "${pytest_args[@]}"
    - name: Upload coverage to Codecov
      if: matrix.resolution == 'locked' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        fail_ci_if_error: true
    - name: Keep only source-built wheels in the uv cache
      # Downloaded wheels are faster to fetch again than to restore.
      run: uv cache prune --ci
