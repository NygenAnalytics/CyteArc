name: Docs

on:
  # The release workflow verifies the exact commit it publishes.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out and build
        type: string
        required: true
      pages:
        description: Prepare the documentation artifact for GitHub Pages
        type: boolean
        default: false
  pull_request:
    branches:
      - master
    paths:
      - "docs/**"
      - "cytearc/**"
      - "LICENSE"
      - "README.md"
      - "pyproject.toml"
      - "tests/test_docs_render.py"
      - "tests/test_docs_structure.py"
      - "tests/test_docs_execution.py"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      HNSWLIB_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install documentation dependencies
        run: uv sync --locked --group docs-modal --extra agent --extra cytebase --extra docs --extra test --extra extra
      - name: Documentation tests
        run: uv run pytest -n 0 tests/test_docs_structure.py tests/test_docs_render.py tests/test_docs_execution.py
      - name: Render complete documentation for GitHub Pages
        if: inputs.pages
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: make -C docs html
      - name: Render complete documentation and check API coverage
        if: ${{ !inputs.pages }}
        # Tutorial execution is an explicit Modal action. This job runs no notebooks.
        run: make -C docs html
      - name: Store documentation preview
        if: ${{ !inputs.pages }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: docs/build/site/_build/html/
          if-no-files-found: error
      - name: Store GitHub Pages site
        if: inputs.pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/site/_build/html/
