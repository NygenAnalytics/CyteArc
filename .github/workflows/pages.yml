name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "cytearc/**"
      - "LICENSE"
      - "README.md"
      - "pyproject.toml"
      - "tests/test_docs_render.py"
      - "tests/test_docs_structure.py"
      - "tests/test_docs_execution.py"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.sha }}
      pages: true

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
